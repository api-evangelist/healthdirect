apis:
- aid: healthdirect:nhsd-fhir-api
  name: NHSD FHIR API
  description: >-
    Real-time, read-only HL7 FHIR API over the National Health Services Directory,
    aligned to the HL7 AU Provider Directory (AU-PD) implementation guide. Supports
    querying Organization, HealthcareService, PractitionerRole, and Practitioner
    resources — including geospatial (location.near), open-now/open-at, service-type
    (SNOMED CT-AU), and identifier searches — for over 400,000 service and practitioner
    records. Secured with OAuth 2.0 client-credentials plus an x-api-key header.
  humanURL: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  baseURL: https://api.fhir.nhsd.healthdirect.org.au/v4
  tags:
  - FHIR
  - Provider Directory
  - Healthcare
  properties:
  - type: Documentation
    url: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  - type: APIReference
    url: https://build.fhir.nhsd.healthdirect.org.au/v4/index.html
  - type: PostmanCollection
    url: collections/nhsd-developers-portal.postman_collection.json
  - type: Documentation
    url: https://media.healthdirect.org.au/publications/NHSD_Developer-Guide.pdf
- aid: healthdirect:nhsd-fhir-bulk-data-export
  name: NHSD FHIR Bulk Data Export
  description: >-
    Read-only HL7 FHIR bulk data export for retrieving large NHSD datasets at a
    specified frequency, for integrators that need the full directory rather than
    real-time single-record lookups.
  humanURL: https://build.fhir.nhsd.healthdirect.org.au/v4/bulkexports.html
  tags:
  - FHIR
  - Bulk Data
  - Provider Directory
  properties:
  - type: Documentation
    url: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  - type: APIReference
    url: https://build.fhir.nhsd.healthdirect.org.au/v4/bulkexports.html
- aid: healthdirect:nhsd-ingestion-hub
  name: NHSD FHIR Ingestion & Data Acquisition Hub
  description: >-
    HL7 FHIR write/inbound interface for approved data-contributing sources to submit
    and maintain health service and practitioner records in the National Health
    Services Directory.
  humanURL: https://build.fhir.nhsd.healthdirect.org.au/ingestion/index.html
  tags:
  - FHIR
  - Ingestion
  - Provider Directory
  properties:
  - type: Documentation
    url: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  - type: APIReference
    url: https://build.fhir.nhsd.healthdirect.org.au/ingestion/index.html
- aid: healthdirect:nhsd-provider-appointments-api
  name: NHSD Provider Appointments API
  description: >-
    API that surfaces real-time appointment availability and booking integration from
    certified provider booking platforms (AutoMed, HealthEngine, HotDoc, MedAdvisor,
    Medi2Apps) within the National Health Services Directory.
  humanURL: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  tags:
  - Appointments
  - Healthcare
  - Provider Directory
  properties:
  - type: Documentation
    url: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  - type: Documentation
    url: https://media.healthdirect.org.au/publications/NHSD_onboarding-pack_provider-appointments-api.zip
- aid: healthdirect:nhsd-widget
  name: NHSD Search Widget
  description: >-
    Embeddable, responsive NHSD search component that third parties can deploy on
    websites and mobile apps to let consumers find health services and practitioners,
    backed by the National Health Services Directory.
  humanURL: https://about.healthdirect.gov.au/what-we-do/portfolio/nhsd/integration-hub/documentation
  baseURL: https://widget.nhsd.healthdirect.org.au/v1/widget/search
  tags:
  - Widget
  - Provider Directory
  - Healthcare
  properties:
  - type: Documentation
    url: https://media.healthdirect.org.au/publications/NHSD_widget-implementation-guide.pdf
