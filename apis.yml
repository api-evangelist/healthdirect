aid: healthdirect
url: https://raw.githubusercontent.com/api-evangelist/healthdirect/refs/heads/main/apis.yml
name: Healthdirect Australia
kind: company
description: >-
  Healthdirect Australia is a national, government-owned, not-for-profit organisation
  that operates core Australian digital-health infrastructure and consumer health
  services on behalf of the Commonwealth, states, and territories. It runs the free
  healthdirect symptom checker and health advice service and, most relevant to
  developers, delivers the National Health Services Directory (NHSD) — the authoritative
  national directory of health services and practitioners, covering more than 400,000
  service and practitioner records. Healthdirect exposes the NHSD to government,
  commercial, and clinical software developers through standards-based HL7 FHIR APIs
  (aligned to the HL7 AU Provider Directory / AU-PD implementation guide, using SNOMED
  CT-AU terminology and G-NAF geocoded addresses), a FHIR bulk data export, a FHIR
  ingestion/data-acquisition hub for contributing sources, an embeddable NHSD search
  widget, and a Provider Appointments API that surfaces real-time appointment
  availability from certified booking platforms. Integration is gated behind a formal
  onboarding and test-environment registration process, and APIs are secured with
  OAuth 2.0 client-credentials plus an API key. Home market is Australia.
