method: searched
source: live probes of Healthdirect + NHSD hosts
notes: >-
  The NHSD API/IAM/IG hosts (api.fhir[.int].nhsd.healthdirect.org.au,
  iam.int.nhsd.healthdirect.org.au, build.fhir.nhsd.healthdirect.org.au) sit
  behind an Amazon CloudFront distribution that geo-blocks all non-Australian
  requests (HTTP 403 "configured to block access from your country"), so no
  well-known discovery documents (smart-configuration, openid-configuration,
  metadata/CapabilityStatement) could be fetched from those hosts from outside
  Australia. The consumer/corporate hosts publish real RFC 9116 security.txt.
